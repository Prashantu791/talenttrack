<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="c1Gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="30%" stop-color="#F5CE7C"/>
      <stop offset="70%" stop-color="#C8963E"/>
      <stop offset="100%" stop-color="#805313"/>
    </linearGradient>
    <linearGradient id="c1Gold2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2B155"/>
      <stop offset="50%" stop-color="#AA7724"/>
      <stop offset="100%" stop-color="#553407"/>
    </linearGradient>
    <linearGradient id="c1Emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="c1Glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(247, 208, 136, 0.4)"/>
      <stop offset="100%" stop-color="rgba(200, 150, 62, 0)"/>
    </radialGradient>
    <filter id="c1Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Outer Hex Shield -->
  <polygon points="50,6 88,25 88,72 50,94 12,72 12,25" 
           fill="#071E20" 
           stroke="url(#c1Gold1)" 
           stroke-width="3" 
           stroke-linejoin="round"
           filter="url(#c1Shadow)"/>

  <!-- Inner Shading Facets -->
  <polygon points="50,14 80,30 80,68 50,86 20,68 20,30" 
           fill="#0A2A2D" 
           stroke="rgba(255,255,255,0.06)" 
           stroke-width="1.2"/>

  <!-- Emerald Lower Facet -->
  <polygon points="50,86 80,68 50,62 20,68" fill="url(#c1Emerald)" opacity="0.8"/>

  <!-- Central Chiseled 'T' Column -->
  <path d="M28,32 L72,32 L72,40 L55,40 L55,72 L45,72 L45,40 L28,40 Z" 
        fill="url(#c1Gold1)" 
        filter="url(#c1Shadow)"/>
  
  <path d="M50,32 L72,32 L72,40 L55,40 L55,72 L50,72 Z" 
        fill="url(#c1Gold2)" 
        opacity="0.4"/>

  <!-- Radiant Talent Diamond at Top Center -->
  <circle cx="50" cy="22" r="10" fill="url(#c1Glow)"/>
  <polygon points="50,14 53,20 60,22 53,24 50,30 47,24 40,22 47,20" fill="url(#c1Gold1)"/>
  <circle cx="50" cy="22" r="1.5" fill="#FFFFFF"/>
</svg>
